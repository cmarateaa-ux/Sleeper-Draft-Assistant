<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sleeper Draft Assistant</title><style>*{box-sizing:border-box}body{margin:0;background:#090b10;color:#f4f5f7;font:14px system-ui,-apple-system,Segoe UI,sans-serif}.app{width:min(460px,100vw);min-height:100vh;margin:auto;padding:14px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.brand{font-weight:800}.live{font-size:11px;padding:5px 8px;border:1px solid #284f36;border-radius:99px;color:#8ee0a4;background:#102117}.connect,.hero,.board,.strategy{margin-top:12px;border:1px solid #252b36;border-radius:14px;background:#11151d}.connect{padding:14px}.connect label{display:block;color:#9aa2b1;font-size:12px;margin-bottom:7px}.row{display:flex;gap:8px}.input{flex:1;background:#090c12;border:1px solid #303746;border-radius:9px;color:#fff;padding:10px;outline:none}.button{border:0;border-radius:9px;padding:0 14px;background:#fff;color:#090b10;font-weight:750;cursor:pointer}.status{margin-top:9px;color:#8f98a8;font-size:12px}.hero{padding:15px}.eyebrow{font-size:11px;text-transform:uppercase;color:#8f98a8;letter-spacing:1px}.pick{font-size:30px;font-weight:850;margin:3px 0}.sub{color:#9aa2b1}.rec{margin-top:12px;border:1px solid #335f42;border-radius:12px;padding:13px;background:#0e1912}.rec h2{margin:2px 0;font-size:20px}.pill{display:inline-block;font-size:10px;font-weight:800;text-transform:uppercase;padding:4px 7px;border-radius:6px;background:#17301f;color:#8ee0a4}.confidence{float:right;font-size:11px;color:#8ee0a4;font-weight:800;margin-top:4px}.why{color:#c7ccd5;margin:8px 0 0;line-height:1.45}.plan{margin-top:10px;padding:10px 11px;border:1px solid #303746;border-radius:9px;background:#0b0e14;color:#d6dae2;line-height:1.4;font-size:12px}.plan b{color:#fff}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:10px}.card{border:1px solid #252b36;border-radius:12px;padding:12px;background:#0e1118}.card .value{font-size:19px;font-weight:800}.card .label{font-size:11px;color:#8f98a8;margin-top:2px}.board{overflow:hidden}.board h3,.strategy h3{margin:0;padding:11px 12px;font-size:12px;color:#9aa2b1;border-bottom:1px solid #252b36}.player{display:flex;justify-content:space-between;gap:10px;padding:9px 12px;border-bottom:1px solid #1c212b}.player:last-child{border:0}.name{font-weight:700}.meta{font-size:11px;color:#858e9e}.rank{font-weight:800;white-space:nowrap}.hidden{display:none}.error{color:#ff8d8d}.ok{color:#8ee0a4}.roster{display:flex;justify-content:space-between;gap:8px;padding:12px}.roster span{flex:1;text-align:center}.roster b{font-weight:800}.strategy{overflow:hidden}.strategyBody{padding:12px}.strategyHeadline{font-weight:800;margin-bottom:6px}.strategySub{font-size:11px;color:#8f98a8;margin-bottom:8px}.survival{font-weight:800;color:#8ee0a4}.muted{color:#8f98a8}</style></head><body><main class="app"><div class="top"><div class="brand">SLEEPER DRAFT ASSISTANT</div><div class="live">● LIVE</div></div><section class="connect"><label>Sleeper draft URL or draft ID</label><div class="row"><input id="draft" class="input" placeholder="Paste your Sleeper draft link…"><button id="connect" class="button">Connect</button></div><div id="status" class="status">Waiting for a draft.</div></section><section id="dashboard" class="hidden"><div class="hero"><div class="eyebrow" id="pickLabel">Your next pick</div><div id="pick" class="pick">—</div><div id="turn" class="sub">Waiting for live draft data</div><div class="rec"><span class="pill" id="recLabel">TARGET</span><span id="confidence" class="confidence"></span><h2 id="rec">Calculating…</h2><p id="why" class="why">Building the live recommendation.</p><div id="plan" class="plan"></div></div></div><div class="grid"><div class="card"><div id="teams" class="value">—</div><div class="label">Teams</div></div><div class="card"><div id="picks" class="value">—</div><div class="label">Picks made</div></div><div class="card"><div id="available" class="value">—</div><div class="label">Players available</div></div><div class="card"><div id="scoring" class="value">—</div><div class="label">Scoring</div></div></div><div class="board"><h3>Your roster</h3><div id="roster" class="roster"></div></div><div class="board"><h3>Alternatives</h3><div id="alternatives"></div></div><div class="strategy"><h3>Next-turn outlook</h3><div id="nextTurn" class="strategyBody"></div></div><div class="board"><h3>Recent picks</h3><div id="recent"></div></div></section></main><script>
const $=id=>document.getElementById(id);let timer=null;const BUILD='sleeper-roster-value-2026-08-31-18';
function draftId(input){const x=input.trim();if(/^\d{10,}$/.test(x))return x;try{const u=new URL(x),parts=u.pathname.split('/').filter(Boolean),i=parts.findIndex(p=>p.toLowerCase()==='draft'),candidate=i>=0?(parts[i+2]??parts[i+1]):null;if(/^\d{10,}$/.test(candidate??''))return candidate}catch{}const m=x.match(/(?:^|\/)draft\/(?:nfl\/)?(\d{10,})(?:[/?#]|$)/i);if(m?.[1])return m[1];throw Error('Enter a Sleeper draft URL or draft ID.')}
async function refresh(id){try{const r=await fetch('/api/recommendations/'+encodeURIComponent(id)+'?v='+Date.now(),{cache:'no-store'}),text=await r.text();let rec;try{rec=JSON.parse(text)}catch{rec={error:text}}if(!r.ok)throw Error(rec.error||'Recommendation service failed');$('dashboard').classList.remove('hidden');const away=rec.picksUntilUser??null;$('teams').textContent=rec.teams??'—';$('picks').textContent=rec.currentPickNo?rec.currentPickNo-1:'—';$('pick').textContent=rec.userPickNo&&rec.userSlot?rec.userPickNo+'.'+rec.userSlot:'—';$('turn').textContent=away===0?'YOU ARE ON THE CLOCK':away===1?'You are on deck · 1 pick away':away!=null?'Your pick in '+away+' picks':'Live Sleeper draft · user slot not identified';$('pickLabel').textContent=away===0?'Your pick · NOW':'Your next pick';$('recLabel').textContent=away===0?'BEST PICK':'TARGET';$('available').textContent=rec.availableCount?.toLocaleString?.()??'—';$('scoring').textContent=String(rec.scoringType??'ppr').replace('_',' ').toUpperCase();if(rec.recommendation){$('rec').textContent=rec.recommendation.name+' · '+rec.recommendation.position;$('confidence').textContent=rec.recommendation.confidence+'% confidence';$('why').textContent=rec.recommendation.reason;$('plan').innerHTML='<b>Draft plan:</b> '+rec.recommendation.plan}else{$('rec').textContent='No recommendation';$('confidence').textContent='';$('why').textContent='No reliable market data is available for enough active players yet.';$('plan').textContent='Waiting for market data.'}const rr=rec.roster??{};$('roster').innerHTML=['QB','RB','WR','TE'].map(pos=>'<span><b>'+pos+'</b> '+(rr[pos]??0)+'</span>').join('');$('alternatives').innerHTML=(rec.alternatives??[]).map((p,i)=>'<div class="player"><div><div class="name">'+p.name+'</div><div class="meta">'+p.position+' · '+(p.team||'FA')+(p.adp?' · ADP '+Number(p.adp).toFixed(1):'')+'</div></div><div class="rank">#'+(i+2)+'</div></div>').join('')||'<div class="player muted">No alternatives yet.</div>';$('nextTurn').innerHTML=rec.nextUserPick?'<div class="strategyHeadline">Your next turn: pick '+rec.nextUserPick+' <span class="muted">('+rec.nextPickDistance+' picks after this one)</span></div>'+(rec.nextTurnTargets??[]).map(p=>'<div class="player"><div><div class="name">'+p.name+'</div><div class="meta">'+p.position+' · '+(p.team||'FA')+' · ADP '+(p.adp?.toFixed?.(1)??'—')+'</div></div><div class="rank survival">'+(p.survivalPct==null?'—':p.survivalPct+'% likely back')+'</div></div>').join(''):'<div class="muted">Next-turn outlook will appear when your draft slot is identified.</div>';$('recent').innerHTML=(rec.recentPicks??[]).map(p=>'<div class="player"><div><div class="name">'+p.name+'</div><div class="meta">Pick '+p.pickNo+' · '+p.position+'</div></div><div class="rank">#'+p.pickNo+'</div></div>').join('');$('status').textContent='Connected · '+(rec.build||BUILD)+' · '+new Date().toLocaleTimeString();$('status').className='status ok'}catch(e){$('status').textContent=e.message+' · build '+BUILD;$('status').className='status error'}}
function start(id){clearInterval(timer);refresh(id);timer=setInterval(()=>refresh(id),2000)}
$('connect').onclick=()=>{try{const id=draftId($('draft').value);localStorage.setItem('sleeperDraftId',id);$('draft').value=id;start(id)}catch(e){$('status').textContent=e.message;$('status').className='status error'}};const saved=localStorage.getItem('sleeperDraftId');if(saved&&/^\d{10,}$/.test(saved)){$('draft').value=saved;start(saved)}else localStorage.removeItem('sleeperDraftId');
</script></body></html>
