<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sleeper Draft Assistant</title><style>*{box-sizing:border-box}body{margin:0;background:#090b10;color:#f4f5f7;font:14px system-ui,-apple-system,Segoe UI,sans-serif}.app{width:min(460px,100vw);min-height:100vh;margin:auto;padding:14px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.brand{font-weight:800}.live{font-size:11px;padding:5px 8px;border:1px solid #284f36;border-radius:99px;color:#8ee0a4;background:#102117}.connect{background:#11151d;border:1px solid #252b36;border-radius:14px;padding:14px}.connect label{display:block;color:#9aa2b1;font-size:12px;margin-bottom:7px}.row{display:flex;gap:8px}.input{flex:1;background:#090c12;border:1px solid #303746;border-radius:9px;color:#fff;padding:10px;outline:none}.button{border:0;border-radius:9px;padding:0 14px;background:#fff;color:#090b10;font-weight:750;cursor:pointer}.status{margin-top:9px;color:#8f98a8;font-size:12px}.hero{margin-top:12px;border:1px solid #252b36;border-radius:14px;padding:15px;background:#11151d}.eyebrow{font-size:11px;text-transform:uppercase;color:#8f98a8;letter-spacing:1px}.pick{font-size:30px;font-weight:850;margin:3px 0}.sub{color:#9aa2b1}.rec{margin-top:12px;border:1px solid #335f42;border-radius:12px;padding:13px;background:#0e1912}.rec h2{margin:2px 0;font-size:20px}.pill{display:inline-block;font-size:10px;font-weight:800;text-transform:uppercase;padding:4px 7px;border-radius:6px;background:#17301f;color:#8ee0a4}.why{color:#c7ccd5;margin:8px 0 0;line-height:1.45}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:10px}.card{border:1px solid #252b36;border-radius:12px;padding:12px;background:#0e1118}.card .value{font-size:19px;font-weight:800}.card .label{font-size:11px;color:#8f98a8;margin-top:2px}.board{margin-top:10px;border:1px solid #252b36;border-radius:12px;overflow:hidden}.board h3{margin:0;padding:11px 12px;font-size:12px;color:#9aa2b1;border-bottom:1px solid #252b36}.player{display:flex;justify-content:space-between;padding:9px 12px;border-bottom:1px solid #1c212b}.player:last-child{border:0}.name{font-weight:700}.meta{font-size:11px;color:#858e9e}.rank{font-weight:800}.hidden{display:none}.error{color:#ff8d8d}.ok{color:#8ee0a4}</style></head><body><main class="app"><div class="top"><div class="brand">SLEEPER DRAFT ASSISTANT</div><div class="live">● LIVE</div></div><section class="connect"><label>Sleeper draft URL or draft ID</label><div class="row"><input id="draft" class="input" placeholder="Paste your Sleeper draft link…"><button id="connect" class="button">Connect</button></div><div id="status" class="status">Waiting for a draft.</div></section><section id="dashboard" class="hidden"><div class="hero"><div class="eyebrow">Draft state</div><div id="pick" class="pick">—</div><div id="turn" class="sub">Waiting for live draft data</div><div class="rec"><span class="pill">Connection</span><h2 id="rec">Connecting…</h2><p id="why" class="why">Testing Sleeper draft metadata and live pick feeds.</p></div></div><div class="grid"><div class="card"><div id="teams" class="value">—</div><div class="label">Teams</div></div><div class="card"><div id="picks" class="value">—</div><div class="label">Picks made</div></div></div><div class="board"><h3>Recent picks</h3><div id="recent"></div></div></section></main><script>
const $=id=>document.getElementById(id);let timer;
function draftId(input){const x=input.trim();if(/^\d{10,}$/.test(x))return x;const m=x.match(/draft\/([^/?#]+)/i);if(m?.[1])return m[1];throw new Error('Enter a Sleeper draft URL or draft ID.');}
async function get(path){const r=await fetch('/api/sleeper'+path,{cache:'no-store'});const text=await r.text();let data;try{data=JSON.parse(text)}catch{data=text}if(!r.ok)throw Error('Sleeper returned '+r.status+(text?' · '+text.slice(0,120):''));return data}
async function refresh(id){try{let d=null,picks=[];let metaError='';try{d=await get('/draft/'+encodeURIComponent(id))}catch(e){metaError=e.message}try{picks=await get('/draft/'+encodeURIComponent(id)+'/picks')}catch(e){throw Error(metaError?metaError+'; picks endpoint: '+e.message:e.message)}$('dashboard').classList.remove('hidden');const teams=Number(d?.settings?.teams??0);$('teams').textContent=teams||'—';$('picks').textContent=picks.length;const slots=Math.max(1,teams||1);const next=picks.length+1;$('pick').textContent=next+'.'+(((next-1)%slots)+1);$('turn').textContent=d?.status?d.status+' · live Sleeper data':'live pick feed · metadata unavailable';$('rec').textContent=metaError?'Live picks connected':'Sleeper draft connected';$('why').textContent=metaError?'The public picks feed is working even though the draft metadata endpoint returned an error. We can build the live board from the picks feed and add metadata fallback next.':'Draft metadata and live picks are connected.';const recent=picks.slice(-8).reverse();$('recent').innerHTML=recent.map(p=>'<div class="player"><div><div class="name">'+(p.metadata?.first_name??'')+' '+(p.metadata?.last_name??'')+'</div><div class="meta">Pick '+p.pick_no+' · '+(p.metadata?.position??'')+'</div></div><div class="rank">#'+p.pick_no+'</div></div>').join('');$('status').textContent=metaError?'Connected to Sleeper picks · metadata returned an error':'Connected · updated '+new Date().toLocaleTimeString();$('status').className='status ok'}catch(e){$('status').textContent=e.message;$('status').className='status error'}}
$('connect').onclick=()=>{try{const id=draftId($('draft').value);localStorage.setItem('sleeperDraftId',id);clearInterval(timer);refresh(id);timer=setInterval(()=>refresh(id),3000)}catch(e){$('status').textContent=e.message;$('status').className='status error'}};const saved=localStorage.getItem('sleeperDraftId');if(saved){$('draft').value=saved;refresh(saved);timer=setInterval(()=>refresh(saved),3000)}
</script></body></html>
